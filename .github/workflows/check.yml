name: Vérifier logement CROUS

on:
  schedule:
    - cron: '*/20 * * * *'   # toutes les 20 minutes
  workflow_dispatch:          # permet de le lancer manuellement pour tester

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: pip install requests

      - name: Vérifier la disponibilité du logement
        run: python check_crous.py

      - name: Sauvegarder l'état pour la prochaine vérification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Mise à jour de l'état"
          git push
